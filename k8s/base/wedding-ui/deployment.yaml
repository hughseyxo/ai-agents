apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-ui
  namespace: wedding-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wedding-ui
  template:
    metadata:
      labels:
        app: wedding-ui
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wedding-ui
          image: ghcr.io/hughseyxo/ai-agents-wedding-ui@sha256:df2c2710c99251c69bd26705dade7ce43d1b642a59e589b34dd79a02b3858eb1
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wedding-data
        - name: tmp
          emptyDir: {}
