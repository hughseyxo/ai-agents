apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-health
  namespace: ai-agents-cron
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Fixes hostPath ownership: DirectoryOrCreate creates the
            # textfile-collector directory as root:root 0755 if it doesn't
            # already exist (whichever pod — this CronJob or node-exporter's
            # DaemonSet — happens to run first on a given node). The main
            # container runs as uid 1001 and needs write access; node-exporter
            # only needs read access, which 0755 already grants regardless of
            # owner. Runs as root briefly, overriding the pod-level
            # runAsNonRoot — chown is the one thing here that requires it.
            - name: fix-textfile-collector-ownership
              image: ghcr.io/hughseyxo/ai-agents-runner@sha256:ad3763b2eddff7e4196ec8dc1442e2bfd685e43d65000f6b2f3ba19066fdd08f
              command: ["chown", "1001:1001", "/var/lib/node_exporter/textfile_collector"]
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  # chown requires CAP_CHOWN even for uid 0 once ALL is
                  # dropped — root alone isn't sufficient under the Linux
                  # capability model.
                  add: ["CHOWN"]
              volumeMounts:
                - name: node-exporter-textfile
                  mountPath: /var/lib/node_exporter/textfile_collector
          containers:
            - name: agent-health
              image: ghcr.io/hughseyxo/ai-agents-runner@sha256:ad3763b2eddff7e4196ec8dc1442e2bfd685e43d65000f6b2f3ba19066fdd08f
              args: ["agent-health"]
              envFrom:
                - secretRef:
                    name: agent-health-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: agents-data
                  mountPath: /home/cian/git/ai-agents/data
                - name: node-exporter-textfile
                  mountPath: /var/lib/node_exporter/textfile_collector
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: agents-data
              hostPath:
                path: /home/cian/git/ai-agents/data
                type: Directory
            - name: node-exporter-textfile
              hostPath:
                path: /var/lib/node_exporter/textfile_collector
                type: DirectoryOrCreate
