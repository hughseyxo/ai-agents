apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-health
  namespace: ai-agents-cron
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: agent-health
              image: ghcr.io/hughseyxo/ai-agents-runner@sha256:7060d27e35444c3e549c0f27d0e8e6543bd8d10eadd86465b4a77e61a833c6c8
              args: ["agent-health"]
              envFrom:
                - secretRef:
                    name: agent-health-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: agents-data
                  mountPath: /home/cian/git/ai-agents/data
                - name: node-exporter-textfile
                  mountPath: /var/lib/node_exporter/textfile_collector
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: agents-data
              hostPath:
                path: /home/cian/git/ai-agents/data
                type: Directory
            - name: node-exporter-textfile
              hostPath:
                path: /var/lib/node_exporter/textfile_collector
                type: DirectoryOrCreate
