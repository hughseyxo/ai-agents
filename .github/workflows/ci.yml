name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r wedding_ui/requirements.txt -r agents/requirements.txt -r plant_ui/requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  validate-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          docker run --rm -v "$(pwd)/k8s:/k8s" ghcr.io/yannh/kubeconform:latest \
            -ignore-missing-schemas -summary /k8s/base

  build:
    needs: [test, validate-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [wedding-ui, runner]
        include:
          - image: wedding-ui
            dockerfile: wedding_ui/Dockerfile
          - image: runner
            dockerfile: Dockerfile.runner
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/hughseyxo/ai-agents-${{ matrix.image }}:latest
          outputs: type=image,name=ghcr.io/hughseyxo/ai-agents-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/hughseyxo/ai-agents-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
